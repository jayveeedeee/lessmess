{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Apply the stored theme before first paint to avoid a flash.
document.documentElement.dataset.theme = localStorage.getItem("tt-theme") || "dark";
</script>
<title>{{.Title}} · lessmess</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/app.css?v={{.AssetsV}}">
<link rel="stylesheet" href="/static/xterm.min.css?v=1">
<script src="/static/htmx.min.js?v=1" defer></script>
<script src="/static/Sortable.min.js?v=1" defer></script>
<script src="/static/xterm.min.js?v=1" defer></script>
<script src="/static/xterm-addon-fit.min.js?v=1" defer></script>
<script src="/static/app.js?v={{.AssetsV}}" defer></script>
</head>
<body data-page="{{.Page}}">
<header>
  <a class="brand" href="/" aria-label="lessmess home"><img class="brand-icon" src="/static/icon.svg" alt="lessmess" width="28" height="28"></a>
  <nav class="topnav">
    <a href="/"{{if or (eq .Page "index") (eq .Page "board")}} class="active"{{end}}>Changes</a>
    <a href="/explorer"{{if eq .Page "explorer"}} class="active"{{end}}>Explorer</a>
  </nav>
  <button id="notif-bell" type="button" title="Docs notifications" aria-label="Docs notifications" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span id="notif-badge"></span></button>
  <button id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">☾</button>
</header>
<div id="banner" class="banner" hidden></div>
<main>
{{template "content" .}}
</main>
<div id="terminal-overlay" hidden>
  <div class="terminal-window">
    <div class="terminal-head">
      <img class="brand-icon" src="/static/icon.svg" alt="" width="28" height="28">
      <span id="terminal-title" class="title"></span>
      <button type="button" class="modal-close" data-close-terminal aria-label="Close">✕</button>
    </div>
    <div class="terminal-body">
      <div id="terminal-container"></div>
      <aside id="terminal-tasks" hidden></aside>
    </div>
    <div id="terminal-status" class="terminal-status" hidden></div>
  </div>
</div>
<div id="notif-modal" hidden>
  <div class="modal notif-window">
    <div class="modal-head">
      <span class="title">Docs notifications</span>
      <button type="button" class="modal-close" data-close-notif aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div id="notif-list"></div>
      <div class="notif-actions">
        <button id="docs-refresh-btn" type="button">Refresh stale docs</button>
        <span id="notif-refresh-status" class="muted"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
{{end}}
