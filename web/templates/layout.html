{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// Apply the stored theme before first paint to avoid a flash.
document.documentElement.dataset.theme = localStorage.getItem("tt-theme") || "dark";
</script>
<title>{{.Title}} · tasktracker</title>
<link rel="stylesheet" href="/static/app.css?v={{.AssetsV}}">
{{if eq .Page "board"}}
<link rel="stylesheet" href="/static/xterm.min.css?v=1">
{{end}}
<script src="/static/htmx.min.js?v=1" defer></script>
<script src="/static/Sortable.min.js?v=1" defer></script>
{{if eq .Page "board"}}
<script src="/static/xterm.min.js?v=1" defer></script>
<script src="/static/xterm-addon-fit.min.js?v=1" defer></script>
{{end}}
<script src="/static/app.js?v={{.AssetsV}}" defer></script>
</head>
<body data-page="{{.Page}}">
<header>
  <a class="brand" href="/">tasktracker</a>
  <span class="crumb">{{.Title}}</span>
  <button id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">☾</button>
</header>
<div id="banner" class="banner" hidden></div>
<main>
{{template "content" .}}
</main>
</body>
</html>
{{end}}
