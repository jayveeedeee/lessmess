{{define "content"}}
<section class="board-head">
  <h2>{{.Data.ID}}</h2>
  <span class="pill status-{{.Data.Overall | statusClass}}">{{.Data.Overall}}</span>
  <button type="button" class="btn-accent" id="continue-session-btn">Continue session</button>
  <button type="button" class="btn-ghost"
          hx-get="/changes/{{.Data.ID}}/plan"
          hx-target="#detail"
          hx-swap="innerHTML">Plan</button>
  <button type="button" class="btn-ghost" id="sessions-btn">Sessions</button>
  <button type="button" class="btn-ghost" id="commit-btn">Commit</button>
  {{if eq .Data.Overall "Done"}}
  <button type="button" class="btn-ghost" id="reopen-btn">Reopen</button>
  {{else}}
  <button type="button" class="btn-ghost" id="close-change-btn">Close change</button>
  {{end}}
  <form class="inline-form"
        hx-post="/changes/{{.Data.ID}}/tasks" hx-swap="none">
    <input type="text" name="title" placeholder="New task title" required>
    <button type="submit">Add task</button>
  </form>
</section>
<div id="board-subs" class="board-subs" hidden></div>
<section id="sessions-panel" class="sessions-panel" hidden>
  <div class="sessions-head">
    <h3>opencode sessions</h3>
    <button type="button" class="btn-ghost" id="new-session-btn">New session</button>
  </div>
  <ul id="sessions-list" class="sessions-list"></ul>
</section>
{{if .Data.Error}}
<div class="error-box">{{.Data.Error}}</div>
{{else}}
<div id="board" class="board" data-change="{{.Data.ID}}">
{{template "boardFragment" .Data}}
</div>
{{end}}
<div id="detail" hidden></div>
{{end}}
